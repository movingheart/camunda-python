[project]
name = "camunda-python"
version = "0.1.0"
description = "Python3 reimplementation of Camunda 7 BPMN engine (semantic-aligned, Apache-2.0 independent implementation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "yingwang" }]
dependencies = [
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "croniter>=2.0",  # M3: timerCycle 的 cron 表达式求值
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# M6：REST 兼容层。httpx 供 fastapi TestClient 使用，python-multipart 供文件上传
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["camunda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
